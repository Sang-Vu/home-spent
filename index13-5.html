<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Olive Money - Sổ tay Chi tiêu</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-light: #f6f6f3;
            --border: #d8d8d3;
            --olive: #8BA26A;
            --item-bg: #fff;
            --max-width: 1200px;
        }

        body {
            font-family: "Inter", sans-serif;
            background: var(--bg-light);
            margin: 0;
            color: #333;
        }

        header {
            background: white;
            border-bottom: 1px solid var(--border);
            padding: 12px 16px;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .container {
            display: flex;
            flex-direction: column;
            max-width: var(--max-width);
            margin: auto;
            padding: 16px;
            gap: 1.5rem;
        }

        .input-row {
            background: var(--item-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .input-row input {
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 8px;
        }

        .add-btn {
            background: var(--olive);
            color: white;
            border: none;
            padding: 10px;
            font-size: 20px;
            border-radius: 8px;
            cursor: pointer;
        }

        /* Category buttons */
        .category-icons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .category-icons button {
            padding: 6px 10px;
            border: 1px solid var(--border);
            background: var(--item-bg);
            border-radius: 8px;
            cursor: pointer;
        }

        /* History */
        .history {
            background: var(--item-bg);
            border-radius: 12px;
            border: 1px solid var(--border);
            padding: 12px;
        }

        .history h3 {
            margin: 0 0 10px;
            font-size: 16px;
        }

        .record {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0;
            border-bottom: 1px solid #eee;
            font-size: 14px;
        }

        .record:last-child {
            border-bottom: none;
        }

        .record .actions {
            display: flex;
            gap: 6px;
            font-size: 14px;
            cursor: pointer;
        }

        /* Layout 2-column for Desktop/Laptop */
        @media (min-width: 1024px) {
            .container {
                flex-direction: row;
                gap: 16px;
            }

            .main-section {
                flex: 1;
                display: flex;
                flex-direction: column;
                gap: 1rem;
            }

            .history {
                flex: 1;
            }
        }
    </style>
</head>

<body>

    <header>
        <h2>Olive Money</h2>
        <small>Sổ tay chi tiêu</small>
    </header>

    <div class="container">
        <div class="main-section">
            <!-- Input -->
            <div class="input-row">
                <input type="date" id="dateInput">
                <input type="text" id="descInput" placeholder="Khoản chi...">
                <input type="number" id="amountInput" placeholder="Số tiền...">
                <button class="add-btn" id="addBtn">+</button>
            </div>

            <!-- Categories -->
            <div class="category-icons">
                <button>🍚 Ăn</button>
                <button>☕ Cafe</button>
                <button>🚌 Đi lại</button>
                <button>🎁 Quà</button>
                <button>🏠 Nhà</button>
                <button>💡 Điện</button>
                <button>📱 ĐT</button>
                <button>⋯ Khác</button>
            </div>
        </div>

        <!-- History -->
        <div class="history" id="history">
            <h3>Lịch sử gần đây</h3>
            <div class="record">
                <span>• Cà phê sáng - 45,000đ</span>
                <div class="actions">
                    <span>✎</span>
                    <span>🗑</span>
                </div>
            </div>
            <div class="record">
                <span>• Bún bò - 30,000đ</span>
                <div class="actions">
                    <span>✎</span>
                    <span>🗑</span>
                </div>
            </div>
            <div class="record">
                <span>• Gửi xe - 5,000đ</span>
                <div class="actions">
                    <span>✎</span>
                    <span>🗑</span>
                </div>
            </div>
            <div class="record">
                <span>• Trà đá - 3,000đ</span>
                <div class="actions">
                    <span>✎</span>
                    <span>🗑</span>
                </div>
            </div>
            <div class="record">
                <span>• Xăng xe - 70,000đ</span>
                <div class="actions">
                    <span>✎</span>
                    <span>🗑</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        // D4 Smart device detection
        function isMobileOrTablet() {
            const ua = navigator.userAgent.toLowerCase();
            const isMobile = /mobile|iphone|ipod|android/.test(ua);
            const isTablet = /ipad|tablet|android(?!.*mobile)/.test(ua);
            const hasTouch = navigator.maxTouchPoints > 0;

            if ((isMobile || isTablet) && hasTouch) return true;
            if (hasTouch && !isMobile && !isTablet) return false;
            return false;
        }
        const isDesktop = !isMobileOrTablet();

        // Optional: Add body class
        document.body.classList.add(isDesktop ? 'desktop' : 'mobile-tablet');

        // Placeholder: Edit/Delete alert
        document.querySelectorAll(".record .actions span").forEach(btn => {
            btn.addEventListener("click", (e) => {
                const action = e.target.textContent === '✎' ? 'Edit' : 'Delete';
                alert(action + ' clicked');
            });
        });
    </script>

</body>

</html>
