<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>App Ghi Chép Chi Tiêu Nhanh</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
            background: #fff;
            border-radius: 16px;
            padding: 16px;
            margin-top: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 16px;
        }

        .input-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 12px;
        }

        input[type="text"],
        input[type="number"],
        input[type="date"] {
            padding: 8px 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 8px;
            flex: 1;
        }

        input:focus {
            border-color: #007bff;
            outline: none;
        }

        button.add-btn {
            background: #007bff;
            color: #fff;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        button.add-btn:hover {
            background: #0056b3;
        }

        .history {
            margin-top: 24px;
        }

        .history h3 {
            border-bottom: 2px solid #eee;
            padding-bottom: 8px;
        }

        .day-section {
            margin-top: 16px;
        }

        .day-header {
            display: flex;
            justify-content: space-between;
            background: #e9f1ff;
            border-radius: 8px;
            padding: 8px 10px;
            font-weight: bold;
        }

        .expense-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fafafa;
            border-radius: 8px;
            padding: 8px 10px;
            margin-top: 6px;
        }

        .expense-item span {
            flex: 1;
        }

        .actions button {
            background: none;
            border: none;
            cursor: pointer;
            margin-left: 6px;
            font-size: 16px;
        }

        .actions button.edit {
            color: #007bff;
        }

        .actions button.delete {
            color: #e74c3c;
        }

        /* Mobile responsive */
        @media (max-width: 480px) {
            .input-row {
                flex-direction: column;
            }

            button.add-btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>Ghi chép chi tiêu</h2>

        <div class="input-row">
            <input type="date" id="dateInput">
            <input type="text" id="descInput" placeholder="Khoản chi...">
            <input type="number" id="amountInput" placeholder="Số tiền...">
            <button class="add-btn" id="addBtn">Thêm</button>
        </div>

        <div class="history">
            <h3>Lịch sử ghi chép hôm nay</h3>
            <div id="historyList"></div>
        </div>
    </div>

    <script>
        const dateInput = document.getElementById('dateInput');
        const descInput = document.getElementById('descInput');
        const amountInput = document.getElementById('amountInput');
        const addBtn = document.getElementById('addBtn');
        const historyList = document.getElementById('historyList');

        // Set ngày hôm nay mặc định
        const today = new Date().toISOString().split('T')[0];
        dateInput.value = today;

        let expenses = JSON.parse(localStorage.getItem('expenses') || '[]');

        const categories = {
            "ăn": "🍜 Ăn uống",
            "cà phê": "☕ Cà phê",
            "xăng": "⛽ Di chuyển",
            "điện": "💡 Hóa đơn",
            "nước": "🚿 Hóa đơn",
            "mua": "🛍️ Mua sắm",
            "thuốc": "💊 Sức khỏe",
        };

        function getCategory(desc) {
            const key = Object.keys(categories).find(k => desc.toLowerCase().includes(k));
            return key ? categories[key] : "💸 Khác";
        }

        function renderHistory() {
            const grouped = expenses.reduce((acc, item) => {
                acc[item.date] = acc[item.date] || [];
                acc[item.date].push(item);
                return acc;
            }, {});

            historyList.innerHTML = '';
            const dates = Object.keys(grouped).sort((a, b) => b.localeCompare(a));

            dates.forEach(date => {
                const items = grouped[date];
                const total = items.reduce((sum, i) => sum + i.amount, 0);
                const section = document.createElement('div');
                section.className = 'day-section';
                section.innerHTML = `
        <div class="day-header">
          <span>${date}</span>
          <span>Tổng: ${total.toLocaleString()}đ</span>
        </div>
      `;
                items.forEach((item, idx) => {
                    const div = document.createElement('div');
                    div.className = 'expense-item';
                    div.innerHTML = `
          <span>${getCategory(item.desc)} - ${item.desc}</span>
          <span>${item.amount.toLocaleString()}đ</span>
          <div class="actions">
            <button class="edit">✏️</button>
            <button class="delete">🗑️</button>
          </div>
        `;
                    // Edit
                    div.querySelector('.edit').onclick = () => {
                        const newDesc = prompt("Sửa nội dung:", item.desc);
                        const newAmt = prompt("Sửa số tiền:", item.amount);
                        if (newDesc && newAmt) {
                            item.desc = newDesc;
                            item.amount = Number(newAmt);
                            saveData();
                            renderHistory();
                        }
                    };
                    // Delete
                    div.querySelector('.delete').onclick = () => {
                        if (confirm("Xóa mục này?")) {
                            expenses = expenses.filter(e => e !== item);
                            saveData();
                            renderHistory();
                        }
                    };
                    section.appendChild(div);
                });
                historyList.appendChild(section);
            });
        }

        function saveData() {
            localStorage.setItem('expenses', JSON.stringify(expenses));
        }

        addBtn.onclick = () => {
            const date = dateInput.value;
            const desc = descInput.value.trim();
            const amount = Number(amountInput.value);
            if (!desc || !amount) return alert("Vui lòng nhập đầy đủ thông tin!");

            expenses.push({ date, desc, amount });
            saveData();
            renderHistory();
            descInput.value = '';
            amountInput.value = '';
            descInput.focus();
        };

        renderHistory();
    </script>
</body>

</html>
