<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <meta name="theme-color" content="#4CAF50" />

    <meta name="mobile-web-app-capable" content="yes" />

    <meta name="apple-mobile-web-app-capable" content="yes" />

    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <meta name="apple-mobile-web-app-title" content="Expense" />

    <link rel="manifest" href="./manifest.webmanifest" />

    <link rel="icon" type="image/png" href="./icons/icon-192.png" />

    <link rel="apple-touch-icon" href="./icons/icon-192.png" />

    <title>Expense Tracker</title>
  <script type="module" crossorigin src="/home-spent/assets/index-DbDjLE4O.js"></script>
  <link rel="stylesheet" crossorigin href="/home-spent/assets/index-BhpElABm.css">
</head>

<body>

    <div id="app">
        <div id="expenseForm" class="container">

            <!-- Global conflict banner -->
            <div id="conflictBanner" class="conflict-banner hidden">
                ⚠ <span id="conflictBannerText"></span>
            </div>

            <!-- Date -->
            <div class="date-bar">
                <input type="date" id="expenseDate">
                <button class="load-btn" title="Load Data" id="loadBtn">
                    ↻
                </button>
            </div>

            <!-- Category -->
            <div class="category-row">
                <div class="segment">
                    <input type="radio" id="food" name="category" value="food" checked>
                    <label for="food">Food</label>

                    <input type="radio" id="daily" name="category" value="daily">
                    <label for="daily">Daily</label>

                    <input type="radio" id="bills" name="category" value="bills">
                    <label for="bills">Bills</label>
                </div>
            </div>

            <!-- Conflict resolution panel (shown instead of the form below
                 when the currently viewed category has an unresolved conflict) -->
            <div id="conflictPanel" class="conflict-panel hidden">
                <div class="conflict-title">
                    ⚠ Xung đột dữ liệu — <span id="conflictCategoryLabel"></span>
                </div>

                <div class="conflict-value-row">
                    <span class="conflict-value-label">Gốc (lần đồng bộ trước):</span>
                    <span id="conflictBaseValue"></span>
                </div>

                <label class="conflict-option">
                    <input type="radio" name="conflictResolution" id="conflictOptionLocal">
                    Giữ trên App: <span id="conflictLocalValue"></span>
                </label>

                <label class="conflict-option">
                    <input type="radio" name="conflictResolution" id="conflictOptionRemote">
                    Giữ trên Sheet: <span id="conflictRemoteValue"></span>
                </label>

                <label class="conflict-option">
                    <input type="radio" name="conflictResolution" id="conflictOptionCustom">
                    Tự nhập giá trị khác:
                </label>

                <input type="tel" id="conflictCustomAmount" placeholder="45+15" class="hidden">
                <textarea id="conflictCustomNote" rows="2" placeholder="Ghi chú" spellcheck="false"
                    class="hidden"></textarea>

                <button id="resolveConflictBtn" class="save-btn" disabled>
                    Giải quyết
                </button>
            </div>

            <!-- Form -->
            <div class="form" id="expenseFields">

                <label for="amount">Amount</label>

                <input id="amount" type="tel" inputmode="tel" placeholder="45+15" autocomplete="off">

                <label for="note">Notes</label>

                <textarea id="note" rows="4" spellcheck="false"></textarea>

                <button id="saveBtn" class="save-btn" disabled>
                    Save
                </button>
                <div id="statusBar"></div>
                <div id="syncStatus"></div>
            </div>

        </div>
    </div>


</body>

</html>
