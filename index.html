<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chi tiêu nhanh</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
        body {
            background: #f9fafb;
            padding: 1rem;
            font-family: "Inter", sans-serif;
        }

        .expense-inputs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .expense-inputs input {
            flex: 1;
        }

        .icon-bar {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }

        .icon-btn {
            font-size: 1.4rem;
            background: #fff;
            border-radius: 10px;
            border: 1px solid #ddd;
            padding: 4px 8px;
            cursor: pointer;
        }

        .icon-btn.active {
            background: #0d6efd;
            color: white;
        }

        .expense-item {
            background: white;
            border-radius: 10px;
            padding: 0.5rem 1rem;
            margin-bottom: 0.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .expense-item small {
            color: gray;
        }

        .date-select {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }
    </style>
</head>

<body>
    <div class="container">
        <h4 class="mb-3">💸 Ghi chi tiêu nhanh</h4>

        <!-- Ngày nhập -->
        <div class="date-select">
            <label for="dateInput">📅</label>
            <select id="dateInput" class="form-select" style="max-width: 180px;">
                <option value="today">Hôm nay</option>
                <option value="yesterday">Hôm qua</option>
                <option value="custom">Chọn ngày khác...</option>
            </select>
            <input type="date" id="customDate" class="form-control" style="max-width: 180px; display:none;">
        </div>

        <!-- Ô nhập -->
        <div class="expense-inputs">
            <input type="text" id="nameInput" class="form-control" placeholder="Tên khoản chi..." />
            <input type="number" id="amountInput" class="form-control" placeholder="Số tiền" />
            <button id="addBtn" class="btn btn-primary">+</button>
        </div>

        <!-- Thanh chọn nhóm (icon) -->
        <div class="icon-bar">
            <div class="icon-btn" data-group="Ăn uống">🍔</div>
            <div class="icon-btn" data-group="Đi lại">🚗</div>
            <div class="icon-btn" data-group="Nhà cửa">🏠</div>
            <div class="icon-btn" data-group="Giải trí">🎮</div>
            <div class="icon-btn" data-group="Mua sắm">🛍️</div>
            <div class="icon-btn" data-group="Khác">💡</div>
        </div>

        <!-- Danh sách chi tiêu -->
        <h6 class="mt-4 mb-2">Danh sách hôm nay</h6>
        <div id="expenseList"></div>
    </div>

    <script>
        const nameInput = document.getElementById("nameInput");
        const amountInput = document.getElementById("amountInput");
        const addBtn = document.getElementById("addBtn");
        const expenseList = document.getElementById("expenseList");
        const iconButtons = document.querySelectorAll(".icon-btn");
        const dateInput = document.getElementById("dateInput");
        const customDate = document.getElementById("customDate");

        let selectedGroup = "";
        let currentDate = new Date().toISOString().split("T")[0];

        // Xử lý chọn ngày
        dateInput.addEventListener("change", () => {
            if (dateInput.value === "today") {
                customDate.style.display = "none";
                currentDate = new Date().toISOString().split("T")[0];
            } else if (dateInput.value === "yesterday") {
                const yesterday = new Date();
                yesterday.setDate(yesterday.getDate() - 1);
                currentDate = yesterday.toISOString().split("T")[0];
                customDate.style.display = "none";
            } else {
                customDate.style.display = "block";
            }
            renderList();
        });

        customDate.addEventListener("change", () => {
            currentDate = customDate.value;
            renderList();
        });

        // Xử lý chọn icon nhóm
        iconButtons.forEach((btn) => {
            btn.addEventListener("click", () => {
                iconButtons.forEach((b) => b.classList.remove("active"));
                btn.classList.add("active");
                selectedGroup = btn.dataset.group;
            });
        });

        // Thêm khoản chi
        addBtn.addEventListener("click", addExpense);
        amountInput.addEventListener("keypress", (e) => {
            if (e.key === "Enter") addExpense();
        });

        function addExpense() {
            const name = nameInput.value.trim();
            const amount = amountInput.value.trim();
            if (!name || !amount) return;

            const autoGroup = detectGroup(name);
            const finalGroup = selectedGroup || autoGroup || "Chưa phân loại";
            const expense = { name, amount: +amount, group: finalGroup, date: currentDate };

            const expenses = getExpenses();
            expenses.push(expense);
            localStorage.setItem("expenses", JSON.stringify(expenses));

            nameInput.value = "";
            amountInput.value = "";
            selectedGroup = "";
            iconButtons.forEach((b) => b.classList.remove("active"));
            nameInput.focus();
            renderList();
        }

        // Gợi ý nhóm theo tên
        function detectGroup(name) {
            const lower = name.toLowerCase();
            if (lower.includes("ăn") || lower.includes("uống") || lower.includes("cà phê")) return "Ăn uống";
            if (lower.includes("xăng") || lower.includes("xe") || lower.includes("taxi")) return "Đi lại";
            if (lower.includes("nhà") || lower.includes("điện") || lower.includes("nước")) return "Nhà cửa";
            if (lower.includes("game") || lower.includes("phim")) return "Giải trí";
            if (lower.includes("mua") || lower.includes("áo") || lower.includes("quần")) return "Mua sắm";
            return "";
        }

        function getExpenses() {
            return JSON.parse(localStorage.getItem("expenses") || "[]");
        }

        function renderList() {
            const expenses = getExpenses().filter((e) => e.date === currentDate);
            expenseList.innerHTML = "";
            expenses.reverse().forEach((e) => {
                const div = document.createElement("div");
                div.className = "expense-item";
                div.innerHTML = `
          <div>
            <strong>${e.name}</strong> <small>(${e.group})</small>
          </div>
          <div>${e.amount.toLocaleString()} đ</div>
        `;
                expenseList.appendChild(div);
            });
        }

        renderList();
    </script>
</body>

</html>
