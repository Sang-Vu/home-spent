<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quản lý Chi tiêu - Responsive (iPhone SE / iPad)</title>
    <style>
        :root {
            --bg-light: #fafafa;
            --border: #ddd;
            --border-strong: #bbb;
            --shadow: rgba(0, 0, 0, 0.06);
            --primary: #4CAF50;
        }

        body {
            font-family: "Segoe UI", system-ui, sans-serif;
            background: var(--bg-light);
            margin: 0;
            padding: 1rem;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        /* Ô nhập */
        .input-row {
            background: #fff;
            border: 1px solid var(--border-strong);
            border-radius: 16px;
            box-shadow: 0 1px 4px var(--shadow);
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .input-row input {
            flex: 1;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 15px;
            outline: none;
        }

        .input-row input:focus {
            border-color: var(--primary);
        }

        .add-btn {
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 10px;
            width: 100%;
            height: 42px;
            font-size: 20px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
        }

        .add-btn:hover {
            background: #43a047;
        }

        /* Dãy icon phân loại */
        .category-icons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            background: transparent;
            /* bỏ khung ngoài */
            padding: 0;
        }

        .category-icons button {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            width: 57px;
            height: 55px;
            border-radius: 12px;
            background: #fff;

            border: 1px solid rgba(0, 0, 0, 0.12);
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);

            cursor: pointer;
            transition: transform 0.15s ease, background 0.2s ease, border-color 0.2s ease;
        }

        .category-icons button span:first-child {
            font-size: 25px;
            /* icon to rõ hơn */
            line-height: 1.3;
            margin-bottom: 2px;
        }

        .category-icons button span:last-child {
            font-size: 11px;
            color: #555;
        }

        .category-icons button:hover {
            background: #f4f4f4;
            transform: scale(1.06);
            border-color: rgba(0, 0, 0, 0.25);
        }

        /* Lịch sử */
        .history-section {
            background: #fff;
            border: 1px solid var(--border-strong);
            border-radius: 16px;
            box-shadow: 0 1px 4px var(--shadow);
            padding: 15px;
        }

        .history-section h3 {
            font-size: 16px;
            margin-bottom: 10px;
            color: #333;
        }

        .history-date {
            font-weight: 600;
            color: #555;
            margin-bottom: 8px;
        }

        .record {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f5f6f7;
            padding: 6px 10px;
            border-radius: 8px;
            margin-bottom: 5px;
            font-size: 15px;
        }

        .history-total {
            text-align: right;
            margin-top: 8px;
            font-weight: 600;
            color: #111;
        }

        /* iPad mini trở lên */
        @media (min-width: 600px) {
            .input-row {
                flex-direction: row;
                align-items: center;
                border: 1px solid var(--border);
                box-shadow: 0 1px 2px var(--shadow);
            }

            .add-btn {
                border-radius: 10px;
                width: 60px;
                height: 42px;
            }

            .category-icons {
                gap: 10px;
            }

            .category-icons button {
                width: 57px;
                height: 55px;
                border: 1px solid rgba(0, 0, 0, 0.08);
                box-shadow: 0 1px 1px rgba(0, 0, 0, 0.04);
            }

            .category-icons button span:first-child {
                font-size: 25px;
            }

            .category-icons button span:last-child {
                font-size: 12px;
            }

            .category-icons button:hover {
                background: #f7f7f7;
                transform: scale(1.04);
            }

            .history-section {
                border: 1px solid var(--border);
                box-shadow: none;
            }
        }

        /* iPad Pro trở lên */
        @media (min-width: 1024px) {
            .category-icons {
                gap: 12px;
            }

            .category-icons button {
                width: 57px;
                height: 55px;
                border-color: rgba(0, 0, 0, 0.07);
            }

            .category-icons button span:first-child {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- Ô nhập -->
        <div class="input-row">
            <input type="date" id="dateInput">
            <input type="text" id="descInput" placeholder="Khoản chi...">
            <input type="number" id="amountInput" placeholder="Số tiền...">
            <button class="add-btn" id="addBtn">+</button>
        </div>

        <!-- Icon phân loại -->
        <div class="category-icons">
            <button><span>🍚</span><span>Ăn</span></button>
            <button><span>☕</span><span>Cafe</span></button>
            <button><span>🚌</span><span>Đi lại</span></button>
            <button><span>🎁</span><span>Quà</span></button>
            <button><span>🏠</span><span>Nhà</span></button>
            <button><span>💡</span><span>Điện</span></button>
            <button><span>📱</span><span>ĐT</span></button>
            <button id="moreBtn"><span>⋯</span><span>Thêm</span></button>
        </div>

        <!-- Lịch sử -->
        <div class="history-section" id="history">
            <h3>Hôm nay</h3>
            <div class="history-date">13/10/2025</div>
            <div class="record">
                <span>Cà phê sáng</span>
                <span>45.000đ</span>
            </div>
            <div class="record">
                <span>Ăn trưa</span>
                <span>75.000đ</span>
            </div>
            <div class="history-total">Tổng: 120.000đ</div>
        </div>
    </div>

    <script>
        const addBtn = document.getElementById("addBtn");
        const dateInput = document.getElementById("dateInput");
        const descInput = document.getElementById("descInput");
        const amountInput = document.getElementById("amountInput");
        const history = document.getElementById("history");

        addBtn.addEventListener("click", () => {
            const date = dateInput.value || new Date().toISOString().split("T")[0];
            const desc = descInput.value.trim();
            const amount = amountInput.value.trim();
            if (!desc || !amount) return alert("Vui lòng nhập đủ thông tin!");

            const newRecord = document.createElement("div");
            newRecord.className = "record";
            newRecord.innerHTML = `
        <span>${desc}</span>
        <span>${Number(amount).toLocaleString()}đ</span>
      `;
            history.insertBefore(newRecord, history.querySelector(".history-total"));

            const totalEl = history.querySelector(".history-total");
            const current = parseInt(totalEl.textContent.replace(/\D/g, "")) || 0;
            const newTotal = current + parseInt(amount);
            totalEl.textContent = "Tổng: " + newTotal.toLocaleString() + "đ";

            descInput.value = "";
            amountInput.value = "";
        });

        document.getElementById("moreBtn").addEventListener("click", () => {
            alert("Tính năng mở rộng sắp ra mắt 😊");
        });
    </script>
</body>

</html>
