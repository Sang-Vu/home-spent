<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />

    <title>Olive Money — UI (S2, Mobile-first, Dark Mode)</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f6f6f3;
            --card: #ffffff;
            --border: #e0e0d6;
            --olive: #6B705C;
            --olive-acc: #8BA26A;
            --text: #222222;
            --muted: #6b6b6b;
            --radius: 12px;
            --input-radius: 10px;
            --gap: 12px;
            --maxw: 720px;
            --shadow: rgba(16, 24, 32, 0.04);
        }

        /* Dark mode */
        .dark {
            --bg: #0f1720;
            --card: #0b1220;
            --border: #17202a;
            --olive: #98b37a;
            --olive-acc: #9fbf7f;
            --text: #e8eef0;
            --muted: #9aa6ad;
            --shadow: rgba(0, 0, 0, 0.6);
        }

        /* Base setup */
        * {
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
        }

        body {
            margin: 0;
            font-family: "Inter", system-ui, -apple-system, Segoe UI, Roboto, Arial;
            background: var(--bg);
            color: var(--text);
            -webkit-font-smoothing: antialiased;
            display: flex;
            justify-content: center;
            padding: 18px;
            touch-action: manipulation;
            overscroll-behavior: none;
        }

        /* Layout */
        .app {
            width: 100%;
            max-width: var(--maxw);
        }

        .main {
            display: flex;
            flex-direction: column;
            gap: 14px;
            transition: padding-bottom 0.25s ease;
        }

        /* Header */
        header.app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 12px 14px;
            margin-bottom: 14px;
            box-shadow: 0 6px 18px var(--shadow);
        }

        .title {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        h1 {
            margin: 0;
            font-size: 18px;
            font-weight: 600;
        }

        .subtitle {
            font-size: 13px;
            color: var(--muted);
        }

        /* Controls */
        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .toggle {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: transparent;
            border: 0;
            cursor: pointer;
            padding: 6px;
            color: var(--muted);
            font-size: 13px;
        }

        /* Card wrapper */
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 14px;
            box-shadow: 0 6px 20px var(--shadow);
            will-change: transform, box-shadow;
        }

        /* Form layout */
        .form {
            display: grid;
            grid-template-columns: 1fr;
            gap: var(--gap);
        }

        .row {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        /* Floating input field */
        .field {
            position: relative;
            display: block;
            margin-bottom: 14px;
        }

        .field input {
            width: 100%;
            padding: 26px 14px 8px;
            border-radius: var(--input-radius);
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text);
            font-size: 15px;
            line-height: 1.4;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
            box-sizing: border-box;
        }

        .field input::placeholder {
            color: var(--muted);
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .field input:focus::placeholder {
            opacity: 1;
        }

        .field input:focus {
            border-color: var(--olive-acc);
            box-shadow: 0 0 0 6px rgba(139, 162, 106, 0.06);
        }

        /* Label position */
        .field span {
            position: absolute;
            left: 14px;
            top: 18px;
            font-size: 14px;
            color: var(--muted);
            pointer-events: none;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            background: transparent;
        }

        .field input:focus+span,
        .field input:not(:placeholder-shown)+span {
            top: 6px;
            font-size: 12px;
            color: var(--olive-acc);
            background: var(--bg);
            padding: 0 4px;
        }

        .dark .field input:focus+span,
        .dark .field input:not(:placeholder-shown)+span {
            background: var(--card);
        }

        /* Buttons */
        .add-btn {
            background: var(--olive-acc);
            color: #fff;
            border: none;
            padding: 10px 14px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            font-size: 15px;
            transition: background 0.15s ease, transform 0.1s ease;
            will-change: transform;
        }

        .add-btn:hover {
            background: var(--olive);
        }

        .add-btn:active {
            transform: translateY(1px);
        }

        /* Chips */
        .chips {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .chip {
            padding: 8px 10px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--card);
            font-size: 14px;
            cursor: pointer;
        }

        /* History */
        .history-wrap {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .history-title {
            font-size: 15px;
            color: var(--muted);
            margin-bottom: 6px;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid rgba(0, 0, 0, 0.03);
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.98), rgba(250, 250, 250, 1));
        }

        .dark .history-item {
            background: linear-gradient(180deg, rgba(13, 18, 28, 0.6), rgba(10, 14, 22, 0.8));
        }

        /* Khi không có bản ghi -> tạo khoảng trống cuộn tự nhiên */
        .history-wrap:empty::after {
            content: "";
            display: block;
            height: 40vh;
        }

        .left {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .icon {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f2f6f0;
            font-size: 18px;
        }

        .dark .icon {
            background: rgba(255, 255, 255, 0.03);
        }

        .meta {
            display: flex;
            flex-direction: column;
        }

        .desc {
            font-size: 14px;
            font-weight: 500;
        }

        .sub {
            font-size: 12px;
            color: var(--muted);
        }

        .right {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .amount {
            font-weight: 700;
            font-size: 14px;
            color: var(--text);
        }

        .action-btn {
            border: none;
            padding: 6px 8px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
        }

        .edit {
            background: #fff3cd;
            color: #7a5a00;
            border: 1px solid rgba(0, 0, 0, 0.04);
        }

        .delete {
            background: #ffdfe0;
            color: #7a1b1b;
            border: 1px solid rgba(0, 0, 0, 0.04);
        }

        .see-more {
            margin-top: 6px;
            border: none;
            background: transparent;
            color: var(--olive-acc);
            font-weight: 600;
            cursor: pointer;
        }

        /* ==== Responsive Menu ==== */
        .sidebar {
            display: none;
            flex-direction: column;
            align-items: center;
            background: var(--card);
            border-right: 1px solid var(--border);
            padding: 12px 0;
            position: fixed;
            top: 0;
            left: 0;
            height: 100%;
            box-shadow: 2px 0 10px var(--shadow);
            z-index: 10;
            transition: width 0.3s ease;
        }

        .sidebar .logo {
            font-size: 22px;
            margin-bottom: 18px;
        }

        .sidebar .nav-item {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--muted);
            text-decoration: none;
            font-size: 15px;
            padding: 10px 14px;
            width: 100%;
            justify-content: center;
            transition: background 0.2s, color 0.2s;
        }

        .sidebar .nav-item.active {
            color: var(--olive-acc);
            font-weight: 600;
        }

        .sidebar .nav-item:hover {
            background: rgba(139, 162, 106, 0.1);
        }

        /* Bottom Nav (Mobile) */
        .bottom-nav {
            position: fixed;
            bottom: env(safe-area-inset-bottom, 0);
            left: 0;
            width: 100%;
            background: var(--card);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-around;
            padding: 6px 0 calc(6px + env(safe-area-inset-bottom, 0));
            z-index: 20;
        }

        .nav-btn {
            flex: 1;
            border: none;
            background: transparent;
            font-size: 18px;
            color: var(--muted);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            cursor: pointer;
            padding: 4px 0;
            transition: color 0.2s;
        }

        .nav-btn.active,
        .nav-btn:hover {
            color: var(--olive-acc);
        }

        .nav-btn span {
            font-size: 11px;
        }

        /* Spacer động khi bàn phím hiện */
        .keyboard-spacer {
            height: env(keyboard-inset-height, 0px);
            transition: height 0.25s ease;
            min-height: 0;
        }


        /* Responsive tweaks */
        @media (max-width:420px) {
            .icon {
                width: 36px;
                height: 36px;
                font-size: 16px;
            }

            .add-btn {
                padding: 10px;
                font-size: 14px;
            }
        }

        /* Đệm tránh che nội dung */
        @media (max-width: 767px) {
            .main {
                padding-bottom: calc(70px + env(safe-area-inset-bottom, 0px));
            }
        }

        @media (min-width: 768px) {
            .bottom-nav {
                display: none;
            }
        }

        @media (min-width:900px) {
            .main {
                gap: 18px;
            }

            .card {
                padding: 18px;
            }
        }

        /* Tablet: mini sidebar */
        @media (min-width: 768px) and (max-width: 1023px) {
            .sidebar {
                display: flex;
                width: 80px;
            }

            .sidebar .nav-item span {
                display: none;
            }

            .app-content {
                margin-left: 80px;
            }
        }

        /* Desktop: full sidebar */
        @media (min-width: 1024px) {
            .sidebar {
                display: flex;
                width: 180px;
                align-items: flex-start;
                padding-left: 18px;
            }

            .app-content {
                margin-left: 180px;
            }

            .sidebar .nav-item {
                justify-content: flex-start;
            }
        }
    </style>

</head>

    <script>
        (function () {
            const spacer = document.getElementById('keyboardSpacer');
            const inputs = document.querySelectorAll('input, textarea');

            function showSpacer(height = 150) {
                spacer.style.height = height + 'px';
                document.body.classList.add('keyboard-open');
            }

            function hideSpacer() {
                spacer.style.height = '0';
                document.body.classList.remove('keyboard-open');
            }

            function scrollToInput(el) {
                // Đảm bảo cuộn nhẹ, không giật
                setTimeout(() => {
                    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }, 150);
            }

            // Fallback: focus/blur
            inputs.forEach(el => {
                el.addEventListener('focus', () => {
                    showSpacer();
                    scrollToInput(el);
                });
                el.addEventListener('blur', hideSpacer);
            });

            // Nếu có visualViewport → chính xác hơn
            if (window.visualViewport) {
                const vv = window.visualViewport;
                let resizeTimer;

                vv.addEventListener('resize', () => {
                    clearTimeout(resizeTimer);
                    resizeTimer = setTimeout(() => {
                        const keyboardHeight = window.innerHeight - vv.height;
                        if (keyboardHeight > 100) {
                            showSpacer(keyboardHeight + 40); // chừa thêm khoảng an toàn
                        } else {
                            hideSpacer();
                        }
                    }, 80);
                });
            }
            const historyWrap = document.getElementById('historyWrap');

            function adjustHistorySpacer() {
                const screenH = window.innerHeight;
                const historyH = historyWrap.scrollHeight;
                const minPad = 80;  // vẫn chừa chút cuộn tự nhiên

                // Nếu lịch sử quá ngắn (ví dụ < 50% màn hình)
                if (historyH < screenH * 0.5) {
                    const pad = Math.max(screenH * 0.5 - historyH, minPad);
                    spacer.style.height = pad + 'px';
                } else {
                    spacer.style.height = '0';
                }
            }

            // Gọi khi load và khi dữ liệu thay đổi
            const observer = new MutationObserver(adjustHistorySpacer);
            observer.observe(historyWrap, { childList: true, subtree: false });

            window.addEventListener('resize', adjustHistorySpacer);
            adjustHistorySpacer();
        })();

    </script>
