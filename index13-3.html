<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Olive Money - Sổ tay Chi tiêu</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-light: #f6f6f3;
            --border: #d8d8d3;
            --shadow: rgba(0, 0, 0, 0.05);
            --primary: #6B705C;
            --primary-light: #A5A58D;
            --olive: #8BA26A;
            --olive-hover: #7C955D;
        }

        body {
            font-family: "Inter", sans-serif;
            background: var(--bg-light);
            margin: 0;
            color: #333;
            display: flex;
        }

        .sidebar {
            display: none;
            width: 180px;
            background: #F2F3EE;
            border-right: 1px solid #e0e0da;
            height: 100vh;
            position: fixed;
            left: 0;
            top: 0;
            padding-top: 60px;
        }

        .sidebar a {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 18px;
            font-size: 15px;
            color: #444;
            text-decoration: none;
        }

        .sidebar a.active {
            background: var(--olive);
            color: white;
            font-weight: 600;
        }

        header {
            background: white;
            border-bottom: 1px solid #e6e6e3;
            padding: 8px 16px;
            position: sticky;
            top: 0;
            z-index: 9;
        }

        .content {
            flex: 1;
            margin-left: 0;
        }

        .container {
            max-width: 900px;
            margin: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        .input-row {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .input-row input {
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
        }

        .add-btn {
            background: var(--olive);
            color: white;
            border: none;
            padding: 10px;
            font-size: 21px;
            border-radius: 10px;
            cursor: pointer;
        }

        @media (min-width: 650px) {
            .input-row {
                flex-direction: row;
                align-items: center;
            }

            .input-row input {
                flex: 1;
            }

            .add-btn {
                width: 60px;
                height: 42px;
            }
        }

        @media (min-width: 1100px) and (pointer: coarse) {
            .container {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 16px;
            }
        }

        .tabbar {
            display: flex;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #fff;
            justify-content: space-around;
            border-top: 1px solid #ddd;
        }

        @media (min-width: 1200px) and (pointer: fine) {
            .sidebar {
                display: block;
            }

            .content {
                margin-left: 180px;
            }

            .tabbar {
                display: none;
            }
        }
    </style>
</head>

<body>
    <div class="sidebar">
        <a href="#" class="active">📝 Nhập liệu</a>
        <a href="#">📜 Lịch sử</a>
    </div>

    <div class="content">
        <header>
            <h1>Olive Money</h1>
            <span>Sổ tay chi tiêu</span>
        </header>

        <div class="container">
            <div>
                <div class="input-row">
                    <input type="date" id="dateInput">
                    <input type="text" id="descInput" placeholder="Khoản chi...">
                    <input type="number" id="amountInput" placeholder="Số tiền...">
                    <button class="add-btn" id="addBtn">+</button>
                </div>

                <div class="category-icons">
                    <button>🍚 Ăn</button>
                    <button>☕ Cafe</button>
                    <button>🚌 Đi lại</button>
                    <button>🎁 Quà</button>
                    <button>🏠 Nhà</button>
                    <button>💡 Điện</button>
                    <button>📱 ĐT</button>
                    <button>⋯ Thêm</button>
                </div>
            </div>

            <div class="history-section" id="history">
                <h3>Hôm nay</h3>
                <div class="record"><span>Cà phê sáng</span><span>45.000đ</span></div>
                <div class="record"><span>Ăn trưa</span><span>75.000đ</span></div>
                <div class="history-total">Tổng: 120.000đ</div>
            </div>
        </div>
    </div>

    <div class="tabbar">
        <a href="#" class="active">📝<br>Nhập liệu</a>
        <a href="#">📜<br>Lịch sử</a>
    </div>

    <script>
        const addBtn = document.getElementById("addBtn");
        const descInput = document.getElementById("descInput");
        const amountInput = document.getElementById("amountInput");
        const history = document.getElementById("history");

        addBtn.addEventListener("click", () => {
            const desc = descInput.value.trim();
            const amount = amountInput.value.trim();
            if (!desc || !amount) return alert("Nhập đủ thông tin!");

            const div = document.createElement("div");
            div.className = "record";
            div.innerHTML = `<span>${desc}</span><span>${Number(amount).toLocaleString()}đ</span>`;
            history.insertBefore(div, history.querySelector(".history-total"));

            const totalEl = history.querySelector(".history-total");
            const current = parseInt(totalEl.textContent.replace(/\D/g, "")) || 0;
            totalEl.textContent = "Tổng: " + (current + +amount).toLocaleString() + "đ";

            descInput.value = "";
            amountInput.value = "";
        });
    </script>
</body>

</html>
