<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>App Ghi Chép Chi Tiêu Nhanh</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
            background: #fff;
            border-radius: 16px;
            padding: 16px;
            margin-top: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 16px;
        }

        .input-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 12px;
            align-items: center;
        }

        input[type="text"],
        input[type="number"],
        input[type="date"] {
            padding: 8px 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 8px;
            flex: 1;
        }

        input:focus {
            border-color: #007bff;
            outline: none;
        }

        button.add-btn {
            background: #007bff;
            color: #fff;
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        button.add-btn:hover {
            background: #0056b3;
        }

        .category-row {
            display: flex;
            justify-content: space-around;
            margin-bottom: 10px;
            flex-wrap: wrap;
            gap: 6px;
        }

        .category-icon {
            font-size: 22px;
            padding: 6px 8px;
            border-radius: 8px;
            background: #f1f3f5;
            cursor: pointer;
            position: relative;
            transition: background 0.2s;
        }

        .category-icon:hover {
            background: #dbeafe;
        }

        .category-icon::after {
            content: attr(data-label);
            position: absolute;
            bottom: -24px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
            background: #333;
            color: #fff;
            padding: 2px 6px;
            border-radius: 6px;
            white-space: nowrap;
            display: none;
        }

        .category-icon:hover::after {
            display: block;
        }

        .history {
            margin-top: 24px;
        }

        .history h3 {
            border-bottom: 2px solid #eee;
            padding-bottom: 8px;
        }

        .day-section {
            margin-top: 16px;
        }

        .day-header {
            display: flex;
            justify-content: space-between;
            background: #e9f1ff;
            border-radius: 8px;
            padding: 8px 10px;
            font-weight: bold;
        }

        .expense-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fafafa;
            border-radius: 8px;
            padding: 8px 10px;
            margin-top: 6px;
        }

        .expense-item span {
            flex: 1;
        }

        .actions button {
            background: none;
            border: none;
            cursor: pointer;
            margin-left: 6px;
            font-size: 16px;
        }

        .actions button.edit {
            color: #007bff;
        }

        .actions button.delete {
            color: #e74c3c;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .input-row {
                flex-direction: row;
                flex-wrap: wrap;
            }

            input[type="text"],
            input[type="number"] {
                flex: 1 1 40%;
            }

            button.add-btn {
                flex: 0 0 auto;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>💰 Ghi chép chi tiêu</h2>

        <!-- Ngày -->
        <div class="input-row">
            <input type="date" id="dateInput">
        </div>

        <!-- Dãy icon phân loại -->
        <div class="category-row" id="categoryRow">
            <div class="category-icon" data-label="Ăn uống" data-cat="ăn">🍜</div>
            <div class="category-icon" data-label="Cà phê" data-cat="cà phê">☕</div>
            <div class="category-icon" data-label="Di chuyển" data-cat="xăng">⛽</div>
            <div class="category-icon" data-label="Hóa đơn" data-cat="điện">💡</div>
            <div class="category-icon" data-label="Mua sắm" data-cat="mua">🛍️</div>
            <div class="category-icon" data-label="Sức khỏe" data-cat="thuốc">💊</div>
        </div>

        <!-- Ô nhập chi + tiền -->
        <div class="input-row">
            <input type="text" id="descInput" placeholder="Khoản chi...">
            <input type="number" id="amountInput" placeholder="Số tiền...">
            <button class="add-btn" id="addBtn">➕</button>
        </div>

        <!-- Lịch sử -->
        <div class="history">
            <h3>Lịch sử ghi chép</h3>
            <div id="historyList"></div>
        </div>
    </div>

    <script>
        const dateInput = document.getElementById('dateInput');
        const descInput = document.getElementById('descInput');
        const amountInput = document.getElementById('amountInput');
        const addBtn = document.getElementById('addBtn');
        const historyList = document.getElementById('historyList');
        const categoryRow = document.getElementById('categoryRow');

        // Ngày hôm nay mặc định
        const today = new Date().toISOString().split('T')[0];
        dateInput.value = today;

        let expenses = JSON.parse(localStorage.getItem('expenses') || '[]');
        let selectedCategory = '';

        // Gán icon click chọn phân loại
        categoryRow.querySelectorAll('.category-icon').forEach(icon => {
            icon.addEventListener('click', () => {
                selectedCategory = icon.dataset.cat;
                categoryRow.querySelectorAll('.category-icon').forEach(i => i.style.background = '#f1f3f5');
                icon.style.background = '#cde4ff';
            });
        });

        const categories = {
            "ăn": "🍜 Ăn uống",
            "cà phê": "☕ Cà phê",
            "xăng": "⛽ Di chuyển",
            "điện": "💡 Hóa đơn",
            "nước": "🚿 Hóa đơn",
            "mua": "🛍️ Mua sắm",
            "thuốc": "💊 Sức khỏe",
        };

        function getCategory(desc) {
            if (selectedCategory) return categories[selectedCategory] || "💸 Khác";
            const key = Object.keys(categories).find(k => desc.toLowerCase().includes(k));
            return key ? categories[key] : "💸 Khác";
        }

        function renderHistory() {
            const grouped = expenses.reduce((acc, item) => {
                acc[item.date] = acc[item.date] || [];
                acc[item.date].push(item);
                return acc;
            }, {});

            historyList.innerHTML = '';
            const dates = Object.keys(grouped).sort((a, b) => b.localeCompare(a));

            dates.forEach(date => {
                const items = grouped[date];
                const total = items.reduce((sum, i) => sum + i.amount, 0);
                const section = document.createElement('div');
                section.className = 'day-section';
                section.innerHTML = `
          <div class="day-header">
            <span>${date}</span>
            <span>Tổng: ${total.toLocaleString()}đ</span>
          </div>
        `;
                items.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'expense-item';
                    div.innerHTML = `
            <span>${getCategory(item.desc)} - ${item.desc}</span>
            <span>${item.amount.toLocaleString()}đ</span>
            <div class="actions">
              <button class="edit">✏️</button>
              <button class="delete">🗑️</button>
            </div>
          `;
                    // Edit
                    div.querySelector('.edit').onclick = () => {
                        const newDesc = prompt("Sửa nội dung:", item.desc);
                        const newAmt = prompt("Sửa số tiền:", item.amount);
                        if (newDesc && newAmt) {
                            item.desc = newDesc;
                            item.amount = Number(newAmt);
                            saveData();
                            renderHistory();
                        }
                    };
                    // Delete
                    div.querySelector('.delete').onclick = () => {
                        if (confirm("Xóa mục này?")) {
                            expenses = expenses.filter(e => e !== item);
                            saveData();
                            renderHistory();
                        }
                    };
                    section.appendChild(div);
                });
                historyList.appendChild(section);
            });
        }

        function saveData() {
            localStorage.setItem('expenses', JSON.stringify(expenses));
        }

        addBtn.onclick = () => {
            const date = dateInput.value;
            const desc = descInput.value.trim();
            const amount = Number(amountInput.value);
            if (!desc || !amount) return alert("Vui lòng nhập đủ thông tin!");

            expenses.push({ date, desc, amount });
            saveData();
            renderHistory();
            descInput.value = '';
            amountInput.value = '';
            selectedCategory = '';
            categoryRow.querySelectorAll('.category-icon').forEach(i => i.style.background = '#f1f3f5');
        };

        renderHistory();
    </script>
</body>

</html>
